<main class="user-wrap" *ngIf="user(); else loggedOutPanel">
  <section class="user-panel">
    <div class="profile-box" aria-hidden="true">
      <div class="avatar"></div>
      <div class="avatar-shoulders"></div>
    </div>

    <p class="profile-line">{{ user()?.fullName }}</p>
    <p class="profile-line">Email: {{ user()?.email }}</p>
    <p class="profile-line">{{ roleLabel }}</p>

    <button class="logout-btn" type="button" (click)="logout()">Wyloguj się</button>

    <section class="notifications" aria-label="Powiadomienia">
      <h2>Powiadomienia</h2>

      <article class="notice-item">
        <div class="event-thumb" aria-hidden="true">
          <span class="thumb-sun"></span>
          <span class="thumb-mountain-left"></span>
          <span class="thumb-mountain-right"></span>
        </div>
        <p class="notice-name">NAME</p>
        <p class="notice-time">starts tommorow</p>
      </article>

      <article class="notice-item">
        <div class="event-thumb" aria-hidden="true">
          <span class="thumb-sun"></span>
          <span class="thumb-mountain-left"></span>
          <span class="thumb-mountain-right"></span>
        </div>
        <p class="notice-name">NAME</p>
        <p class="notice-time">starts in 2 days</p>
      </article>
    </section>
  </section>
</main>

<ng-template #loggedOutPanel>
  <app-login></app-login>
</ng-template>
