<main class="user-wrap">

      <div class="avatar"></div>
      <div class="avatar-shoulders"></div>
    </div>

    <p class="profile-line">Imie Nazwisko</p>

    <section class="notifications" aria-label="Powiadomienia">

          <span class="thumb-mountain-right"></span>
        </div>
