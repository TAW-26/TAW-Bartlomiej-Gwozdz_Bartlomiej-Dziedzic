<main class="login-wrap">
  <section class="login-panel">
    <div class="login-header">
      <h2>{{ panelActionText }}</h2>
      <p class="login-lead">
        {{ panelActionText }}, by móc korzystać z panelu użytkownika i zapisu do wydarzeń.
      </p>
    </div>

    <div class="mode-switch" role="tablist" aria-label="Tryb formularza">
      <button
        type="button"
        role="tab"
        class="mode-btn"
        [class.is-active]="mode === 'login'"
        [attr.aria-selected]="mode === 'login'"
        (click)="setMode('login')"
      >
        Logowanie
      </button>
      <button
        type="button"
        role="tab"
        class="mode-btn"
        [class.is-active]="mode === 'register'"
        [attr.aria-selected]="mode === 'register'"
        (click)="setMode('register')"
      >
        Rejestracja
      </button>
    </div>

    <p class="status-msg" *ngIf="message" [class.status-msg--error]="messageKind === 'error'">
      {{ message }}
    </p>

    @if (mode === 'login') {
      <app-login-form
        [isSubmitting]="isSubmitting"
        [email]="loginEmail"
        (loginSubmitted)="submitLogin($event)"
      ></app-login-form>
    } @else {
      <app-register-form
        [isSubmitting]="isSubmitting"
        (registerSubmitted)="submitRegister($event)"
      ></app-register-form>
    }
  </section>
</main>
