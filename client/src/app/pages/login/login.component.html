<main class="login-wrap">
  <section class="login-panel">
    <h2>{{ panelActionText }}</h2>
    <p class="login-lead">
      {{ panelActionText }}, by móc korzystać z panelu użytkownika i zapisu do wydarzeń.
    </p>

    <div class="mode-switch" role="tablist" aria-label="Tryb formularza">
      <button
        type="button"
        role="tab"
        class="mode-btn"
        [class.is-active]="mode === 'login'"
        [attr.aria-selected]="mode === 'login'"
        (click)="setMode('login')"
      >
        Logowanie
      </button>
      <button
        type="button"
        role="tab"
        class="mode-btn"
        [class.is-active]="mode === 'register'"
        [attr.aria-selected]="mode === 'register'"
        (click)="setMode('register')"
      >
        Rejestracja
      </button>
    </div>

    <p class="status-msg" *ngIf="message" [class.status-msg--error]="messageKind === 'error'">
      {{ message }}
    </p>

    <form
      class="login-form"
      *ngIf="mode === 'login'"
      [formGroup]="loginForm"
      (ngSubmit)="submitLogin()"
    >
      <label class="login-field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="username" />
      </label>

      <label class="login-field">
        <span>Hasło</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      <button class="login-submit" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Wysyłanie...' : 'Zaloguj się' }}
      </button>
    </form>

    <form
      class="login-form"
      *ngIf="mode === 'register'"
      [formGroup]="registerForm"
      (ngSubmit)="submitRegister()"
    >
      <label class="login-field">
        <span>Imię i nazwisko</span>
        <input type="text" formControlName="fullName" autocomplete="name" />
      </label>

      <label class="login-field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="login-field">
        <span>Hasło</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <label class="login-field">
        <span>Powtórz hasło</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </label>

      <button class="login-submit" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Wysyłanie...' : 'Zarejestruj się' }}
      </button>
    </form>
  </section>
</main>
