<main class="events-wrap">
  <section class="events-panel">
    <form
      class="search-form"
      [formGroup]="filters"
      (ngSubmit)="submitSearch()"
      aria-label="Wyszukiwanie wydarzeń"
    >
      <label class="search-field search-field--wide">
        <span>Szukaj</span>
        <input type="text" formControlName="q" placeholder="Nazwa, opis, organizator..." />
      </label>

      <label class="search-field">
        <span>Miasto</span>
        <input type="text" formControlName="city" placeholder="Np. Krakow" />
      </label>

      <label class="search-field">
        <span>Kategoria</span>
        <input type="text" formControlName="category" placeholder="Np. Edukacja" />
      </label>

      <label class="search-field">
        <span>Od</span>
        <input type="date" formControlName="from" />
      </label>

      <label class="search-field">
        <span>Do</span>
        <input type="date" formControlName="to" />
      </label>

      <label class="search-field">
        <span>Status</span>
        <select formControlName="status">
          <option value="">Wszystkie</option>
          <option value="open">open</option>
          <option value="closed">closed</option>
        </select>
      </label>

      <button class="search-submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Szukanie…' : 'Filtruj' }}
      </button>
    </form>

    @if (isOrganizer()) {
      <div class="organizer-actions">
        <a routerLink="/organizer" class="action-btn create-btn">+ Nowe wydarzenie</a>
      </div>
    }

    @if (loading()) {
      <div class="spinner-wrap">
        <div class="spinner"></div>
      </div>
    } @else {
      <div class="events-list">
        @for (resource of resources(); track resource.id) {
          <app-resource-card [resource]="resource"></app-resource-card>
        } @empty {
          <p class="empty-state">Brak wydarzeń spełniających kryteria.</p>
        }
      </div>
    }
  </section>
</main>
