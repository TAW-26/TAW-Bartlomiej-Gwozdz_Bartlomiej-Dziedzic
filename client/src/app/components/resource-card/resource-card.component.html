<a
  class="resource-card"
  [routerLink]="['/events', resource.id]"
  aria-label="Otwórz szczegóły wydarzenia"
>
  <div class="resource-thumb">
    <img
      class="resource-image"
      [src]="resource.imageUrl || placeholderImage"
      [alt]="'Grafika wydarzenia: ' + resource.name"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
    />
  </div>

  <div class="resource-content">
    <h3>{{ resource.name }}</h3>
    <p>{{ resource.category }}</p>
    <p>{{ resource.city }}</p>
    <p>{{ resource.location }}</p>
    <p>{{ resource.startsAt }}</p>
    <p>{{ resource.endsAt }}</p>
    <p>{{ resource.status }}</p>
  </div>

  <p class="resource-description">{{ resource.description }}</p>
</a>
